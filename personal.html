.modal { position: fixed; inset: 0; background: rgba(20,30,45,.45); display: none; align-items: center; justify-content: center; z-index: 50; }

ward-001","name":"电子科技大学优秀毕业生","issuer":"电子科技大学","date":"2020","description":null,"source_notes":[]},{"id":"award-002","name":"一等学业奖学金、优秀学生奖学金、优秀毕业生奖学金等共计6次","issuer":"电子科技大学","date":"2022","description":"2016-2022","source_notes":[]},{"id":"award-003","name":"华为杯研究生数学建模国家二等奖","issuer":"教育部学位与研究生教育发展中心","date":"2021","description":null,"source_notes":[]},{"id":"award-004","name":"数学建模美赛 M 奖（13%）","issuer":null,"date":"2021","description":null,"source_notes":[]}],"languageList":[{"language":"Chinese","proficiency":"native","evidence":null},{"language":"English","proficiency":"professional","evidence":"CET-4 553 / CET-6 531 / IELTS 6.5"}],"projects":{"isp":[{"file":"loco_apply.md","title":"loco_apply IP 升级","status":"已交付","intro":"HDR 局部 tone mapping 应用 IP（loco 方案）。","oneLiner":"（待补充）","results":"","md":"# loco_apply IP 升级\n\n- 时间：（待补充）\n- 单位：大疆 威新研发部（ISP）\n- 状态：已交付\n- 简介：HDR 局部 tone mapping 应用 IP（loco 方案）。\n\n## 方案背景：HDR tone mapping 与 loco 方案\n- HDR 成像：多帧不同曝光合成高动态范围图像后，动态范围远超显示/存储能力，需要 tone mapping 压缩到 LDR\n- 全局 tone mapping：单一映射曲线（如 Reinhard：L_out = L / (1 + L)），实现简单，但高光/暗部细节易同时丢失\n- 局部 tone mapping（loco 即此类方案）：基于局部邻域统计做自适应压缩（分层滤波、局部均值引导等），能保留局部对比度，但：\n  - 需要多尺度滤波/统计，硬件面积与功耗较大\n  - 参数多、逐场景调优困难，极限场景效果有限\n- hdrnet 思路：用神经网络端到端学习 HDR 映射（预测逐像素/局部仿射系数 + 引导滤波），参数少、效果好 → 下一代项目以 hdrnet 替换 loco 的动机：减小面积功耗、提升效果（见 技术规划/hdrnet方案输出.md）\n\n## 功能要点\n（待补充）\n\n## 量化成果\n（待补充）\n","type":"ip"},{"file":"3dlut.md","title":"3dlut IP 升级","status":"开发中","intro":"三维查找表色彩校正 IP，支持三线性/四面体插值。","oneLiner":"```","results":"","md":"# 3dlut IP 升级\n\n- 时间：（待补充）\n- 单位：大疆 威新研发部（ISP）\n- 状态：开发中\n- 简介：三维查找表色彩校正 IP，支持三线性/四面体插值。\n\n## 方案背景：3D LUT 色彩校正原理\n- 3D LUT（三维查找表）将输入 RGB 三元组直接映射为输出 RGB 三元组，用于色彩校正、色彩风格化（color grading）、色域转换等\n- 全表存储不可行（如 33³ 节点需存 35937 个 RGB 值），因此只存稀疏节点，中间值由插值求得\n- 三线性插值：设输入落在包围盒 [x0,x1]×[y0,y1]×[z0,z1]，先沿 x 方向做 4 组插值，再沿 y 做 2 组，最后沿 z 做 1 组（共 7 次线性插值）：\n```\nw_x = (x - x0) / (x1 - x0)\nI_xy  = (1 - w_x)·L[x0] + w_x·L[x1]        （每个角点重复此步）\nI_xyz = (1 - w_y)·I_y0 + w_y·I_y1\nI_out = (1 - w_z)·I_z0 + w_z·I_z1\n```\n- 四面体插值（tetrahedral）：把立方体按对角线划分为 6 个四面体，只需最近的 4 个节点做一次加权平均，乘法次数更少，硬件实现常用\n- 硬件要点：输入高位 bit 做 LUT 索引、低位 bit 做插值权重；表深度、位宽与插值方式直接决定面积/精度\n\n## 功能要点\n（待补充）\n\n## 量化成果\n（待补充）\n","type":"ip"},{"file":"hflip.md","title":"hflip IP 升级","status":"开发中","intro":"水平镜像翻转 IP，基于行缓存与地址反转实现。","oneLiner":"```","results":"","md":"# hflip IP 升级\n\n- 时间：（待补充）\n- 单位：大疆 威新研发部（ISP）\n- 状态：开发中\n- 简介：水平镜像翻转 IP，基于行缓存与地址反转实现。\n\n## 方案背景：水平镜像翻转原理\n- 水平镜像（horizontal flip）的坐标映射：\n```\nx' = W - 1 - x\ny' = y\n```\n- 本质是像素读出顺序反转：写地址不变、读地址反转，或用双口 SRAM 的读写地址互换实现\n- 流式处理（raster/tile 输入）下需要缓存一整行：数据按正常顺序写入行缓存（line buffer），读出时从行尾读到行头\n- 优化技巧：\n  - 当行宽 W 为 2 的幂时，x' = ~x（按位取反）即可完成地址反转，省去减法器\n  - 与前后级 DMA/压缩模块配合，可将镜像与搬运合并，减少一次中间缓存\n- 注意与图像格式的配合：yuv/bayer 等格式翻转时需同步处理子采样相位（UV 分量、bayer 相位奇偶）\n\n## 功能要点\n（待补充）\n\n## 量化成果\n（待补充）\n","type":"ip"},{"file":"dither.md","title":"dither IP 升级","status":"开发中","intro":"输出位深压缩抖动 IP，抑制量化条带（banding）。","oneLiner":"```","results":"","md":"# dither IP 升级\n\n- 时间：（待补充）\n- 单位：大疆 威新研发部（ISP）\n- 状态：开发中\n- 简介：输出位深压缩抖动 IP，抑制量化条带（banding）。\n\n## 方案背景：抖动（dither）原理\n- 问题：位深截断（如 14bit 管线 → 10bit 输出）直接截断会在低梯度区域产生周期性量化误差，视觉上呈条带/轮廓（banding）\n- 核心思想：量化前叠加小幅抖动信号，把量化误差从低频条带打散成高频噪声；人眼与后级滤波对高频噪声不敏感，视觉上消除 banding\n- 常用两类方法：\n  - 有序抖动（ordered dithering）：用阈值矩阵（如 Bayer 矩阵）与像素坐标比较决定加 0 还是加 1 LSB\n  - 误差扩散（error diffusion）：以 Floyd-Steinberg 为例，将当前像素量化误差按权重扩散到邻域：\n```\ne  = I(x,y) - Q(I(x,y))\nI(x+1,y)   += 7/16 · e\nI(x-1,y+1) += 3/16 · e\nI(x,y+1)   += 5/16 · e\nI(x+1,y+1) += 1/16 · e\n```\n- ISP 中 dither 通常位于输出位深压缩位置，用极低成本保留低 bit 的视觉信息，提升暗部/渐变场景画质\n\n## 功能要点\n（待补充）\n\n## 量化成果\n（待补充）\n","type":"ip"},{"file":"cve_harden.md","title":"cve_harden 交付","status":"开发中","intro":"ISP CVE IP 的物理实现硬化（PR、时序收敛与签核）。","oneLiner":"（待补充）","results":"","md":"# cve_harden 交付\n\n- 时间：（待补充）\n- 单位：大疆 威新研发部（ISP）\n- 状态：开发中\n- 简介：ISP CVE IP 的物理实现硬化（PR、时序收敛与签核）。\n\n## IP 定位\n（待补充）\n\n## 功能要点\n（待补充）\n\n## 量化成果\n（待补充）\n","type":"harden"},{"file":"AI开发流程实践.md","title":"AI开发流程实践","status":"虚拟组推广中","intro":"基于 cmodel 打通 preg、lrs、lld、rtl、ppa 优化流程，依托组内知识库支持 CBB。","oneLiner":"（待补充）","results":"","md":"# AI开发流程实践\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（ISP · AI虚拟组）\n- 状态：虚拟组推广中\n- 简介：基于 cmodel 打通 preg、lrs、lld、rtl、ppa 优化流程，依托组内知识库支持 CBB。\n\n## 工作内容\n- 基于 cmodel 打通 preg、lrs、lld、rtl、ppa 优化流程\n- 基于组内知识库，支持 CBB（Common Building Block）的沉淀与复用\n\n## 量化成果\n（待补充）\n","type":"planning"},{"file":"lut实现前后端联合优化.md","title":"lut 实现前后端联合优化","status":"已落地","intro":"9 种 257x16 gamma LUT 方案评估，求面积/功耗/congestion 均衡解并落地超 50% LUT 相关 IP。","oneLiner":"","results":"项目超过 50% 的 lut 相关 IP 完成落地","md":"# lut 实现前后端联合优化\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（技术规划）\n- 状态：已落地\n- 简介：9 种 257x16 gamma LUT 方案评估，求面积/功耗/congestion 均衡解并落地超 50% LUT 相关 IP。\n\n## 背景知识：congestion\n- congestion（布线拥塞）指物理设计中局部区域布线资源供不应求，导致绕线、时序恶化甚至无法完成布线\n- LUT（查找表）方案中，257x16 规格的表项需要大量存储单元和译码/多路选择逻辑，密集的表项访问会占用大量局部布线资源，加剧 congestion\n- 因此 LUT 方案选型不能只看面积和功耗，还需结合布线拥塞做三方权衡，本工作中即为面积、功耗、congestion 三者找均衡解\n\n## 工作内容\n- 实现 9 种 257x16 的 gamma 方案\n- 找出面积、功耗、congestion 的均衡解\n- 完成 PA 到 joules、PTPX 的验证\n\n## 量化成果\n- 项目超过 50% 的 lut 相关 IP 完成落地\n","type":"planning"},{"file":"hdrnet方案输出.md","title":"hdrnet 方案输出","status":"分析中","intro":"输出 NN 实现 HDR 的 hdrnet 方案，目标下一代替换 loco 方案。","oneLiner":"（待补充）","results":"","md":"# hdrnet 方案输出\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（技术规划）\n- 状态：分析中\n- 简介：输出 NN 实现 HDR 的 hdrnet 方案，目标下一代替换 loco 方案。\n\n## 项目背景\n- hdrnet 是用 NN（神经网络）实现 HDR 的方法\n- 目的：在下一代项目中替换 loco 方案，以减小面积和功耗、提升效果\n\n## 量化成果\n（待补充）\n","type":"planning"}],"npu":[{"file":"linesync_dma.md","title":"项目1：linesync_dma R2T/T2T IP 开发","status":"先进工艺已TO","intro":"linesync 协议 tile 级在线数据搬运 IP，支持 y/yuv/bayer 格式、固定有损压缩、unshuffle 与 uint2int 转换。","oneLiner":"ai-isp 场景下，基于 linesync 协议完成 isp ocm 到 npu L3 sram 的 tile 级在线数据搬运，支持 y、yuv、bayer 图像格式。","results":"完成 R2T / T2T IP 开发","md":"# 项目1：linesync_dma R2T/T2T IP 开发\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（NPU IP 设计）\n- 状态：先进工艺已TO\n- 简介：linesync 协议 tile 级在线数据搬运 IP，支持 y/yuv/bayer 格式、固定有损压缩、unshuffle 与 uint2int 转换。\n\n## 项目背景\nai-isp 场景下，基于 linesync 协议完成 isp ocm 到 npu L3 sram 的 tile 级在线数据搬运，支持 y、yuv、bayer 图像格式。\n\n## 方案背景\n### 1. DMA 与 tile 级在线搬运\n- 专用搬运引擎（DMA）不经过 CPU，按描述符在源/目的之间批量搬数；本 IP 专门负责 isp ocm → npu L3 sram 的图像搬运\n- tile 级在线搬运：图像切成 tile，NPU 算当前 tile 的同时搬运下一个 tile，计算与访存重叠，隐藏搬运时延\n\n### 2. linesync 协议\n- 行级同步协议：相邻 IP 之间按行握手（每行有效信号 + 就绪信号），实现无背压中断的流水搬运，支持跨 IP 的行级背压与流量控制\n\n### 3. 有损压缩取舍\n- 图像数据压缩（固定有损压缩）直接降低 sram 访问与总线带宽占用\n- 固定压缩率便于硬件地址规划与带宽预算；损失集中在视觉不敏感分量，保证 NPU 推理精度不降\n\n### 4. 格式适配\n- y / yuv / bayer 格式字段拆分（unshuffle）与数据类型转换（uint2int），把 ISP 输出转成 NPU 张量可直接消费的排布\n\n## 功能要点\n- 包含固定有损压缩处理\n- unshuffle\n- uint2int\n\n## 量化成果\n- 完成 R2T / T2T IP 开发\n","type":"ip"},{"file":"VCR.md","title":"项目2：VCR IP 升级","status":"先进工艺已TO","intro":"NN 网络前处理 IP，负责 4K 图像 crop+resize、YUV 转 RGB、10b 转 8b 及 dubc 压缩/解压。","oneLiner":"NN 网络前处理 IP，支持 4k 图像 crop+resize 操作、YUV 转 RGB、10b 转 8b 等功能。","results":"完成架构升级","md":"# 项目2：VCR IP 升级\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（NPU IP 设计）\n- 状态：先进工艺已TO\n- 简介：NN 网络前处理 IP，负责 4K 图像 crop+resize、YUV 转 RGB、10b 转 8b 及 dubc 压缩/解压。\n\n## 项目背景\nNN 网络前处理 IP，支持 4k 图像 crop+resize 操作、YUV 转 RGB、10b 转 8b 等功能。\n\n## 方案背景\n### 1. resize 插值算法\n- 双线性插值（2x2 邻域，4 次乘加）：\n```\nI(x,y) = (1-a)(1-b)·I00 + a(1-b)·I10 + (1-a)b·I01 + ab·I11\n其中 a = x - x0, b = y - y0 为小数部分\n```\n- 双三次插值（4x4 邻域，16 个采样点 + 三次核），画质更好但资源开销大，按场景选型\n\n### 2. YUV ↔ RGB 转换（BT.601 示例）\n```\nR = Y + 1.402·(V-128)\nG = Y - 0.344·(U-128) - 0.714·(V-128)\nB = Y + 1.772·(U-128)\n```\n- 不同标准（BT.601/BT.709/BT.2020）系数不同；转换放在 resize 同一条流水线上可省一次中间缓存\n\n### 3. dubc 压缩\n- 块压缩格式（block-based compression）：图像按小块压缩存储/传输，解压靠硬件小面积完成\n- 收益：节省 L3 sram 容量与带宽，代价是固定压缩率下的少量画质损失，适合 NN 前处理输入场景\n\n## 功能要点\n- 基于本人维护的预处理需求收集表完成架构升级\n- 新增 dubc 压缩/解压格式\n- 为解决 pocket pose 网络延时问题，设计两级缓存性能带宽优化\n\n## 量化成果\n- 完成架构升级\n","type":"ip"},{"file":"非线性算子调研.md","title":"非线性算子调研","status":"已落地","intro":"调研并落地 minimax 二次插值非线性算子（exp/ln/1x/sin/cos/tanh 等），已在 NPU SFU 单元实现。","oneLiner":"调研 nvidia minimax 非线性算子优化实现，包括 exp、ln、1/x、sin/cos、tanh、atan。","results":"相比于常规插值方法：输入范围更大、精度可高 3 个数量级、面积新增 60%；已在 NPU SFU 单元落地","md":"# 非线性算子调研\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（NPU IP 设计）\n- 状态：已落地\n- 简介：调研并落地 minimax 二次插值非线性算子（exp/ln/1x/sin/cos/tanh 等），已在 NPU SFU 单元实现。\n\n## 项目背景\n调研 nvidia minimax 非线性算子优化实现，包括 exp、ln、1/x、sin/cos、tanh、atan。\n\n## 原理依据（论文：High-Speed Function Approximation using a Minimax Quadratic Interpolator）\n- 出处：Piñeiro, Oberman(NVIDIA), Muller, Bruguera, IEEE Transactions on Computers, 2005（论文 PDF 与提取文本在同目录 QuadraticIEEETC0305.pdf/.txt）\n- 核心方法：表驱动 + 增强 minimax 二次插值\n  1. 输入拆分：X = X1 + X2，X1 取高 6-7 bit 作为 LUT 索引，X2 为低 bit 余量\n  2. 每子区间用二次多项式逼近：\n```\nf(X) ≈ C2·X2² + C1·X2 + C0\n```\n  3. 系数 C0/C1/C2 由增强 minimax 逼近求得：迭代过程中考虑系数有限字长舍入的影响，使表项可以更短 → LUT 面积进一步缩小\n  4. 多项式求值：专用平方器算 X2²（比标准平方器小且快）+ 冗余算术 + 融合累加树（fused accumulation tree）一次完成多操作数加法，面积小于标准乘法器、时延接近单次乘法\n  5. 舍入策略：注入函数特定 rounding bias 后截断，可保证 1/2/4 ulp 精度\n- 收益本质：达到线性插值（大表）的速度，同时拥有二次插值（小表）的面积（约 12-15Kb/函数 vs 线性方法 50-75Kb）\n- 与普通插值对比：输入范围更大（范围缩减 + 多子区间覆盖）、精度可高 3 个数量级；代价是新增平方器/累加树，面积 +60%\n\n## 本人工作\n- 完成调研文档\n- 算法原型\n- 精度测试代码\n- RTL demo\n\n## 量化成果\n- 相比于常规插值方法：输入范围更大、精度可高 3 个数量级、面积新增 60%\n- 已在 NPU SFU 单元落地\n","type":"planning"}],"slam":[{"file":"deroll_maphex.md","title":"deroll_maphex IP 升级","status":"先进工艺已量产","intro":"成像链路 IP，基于相机内外参与 IMU 数据完成去畸变与卷帘快门 derolling。","oneLiner":"```","results":"PR 面积降低 3.9%；PA 仿真功耗降低 16.1%","md":"# deroll_maphex IP 升级\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（SLAM IP 设计）\n- 状态：先进工艺已量产\n- 简介：成像链路 IP，基于相机内外参与 IMU 数据完成去畸变与卷帘快门 derolling。\n\n## 方案背景：相机去畸变与 derolling 原理\n\n### 1. 针孔相机模型与内参\n- 相机内参矩阵 K：fx、fy 为焦距（像素单位），cx、cy 为主点坐标\n```\nK = [ fx  0   cx ]\n    [ 0   fy  cy ]\n    [ 0   0   1  ]\n```\n- 像素坐标 (u, v) → 归一化像平面坐标 (x_n, y_n)：\n```\nx_n = (u - cx) / fx\ny_n = (v - cy) / fy\n```\n\n### 2. 镜头畸变模型（Brown-Conrady）\n- 畸变由两部分组成：径向畸变（k1、k2、k3）与切向畸变（p1、p2）\n- 令 r² = x_n² + y_n²，理想归一化坐标 (x_n, y_n) 经畸变后为：\n```\nx_d = x_n·(1 + k1·r² + k2·r⁴ + k3·r⁶) + 2·p1·x_n·y_n + p2·(r² + 2·x_n²)\ny_d = y_n·(1 + k1·r² + k2·r⁴ + k3·r⁶) + p1·(r² + 2·y_n²) + 2·p2·x_n·y_n\n```\n- 畸变后的实际像素坐标：\n```\nu_d = fx·x_d + cx\nv_d = fy·y_d + cy\n```\n\n### 3. 去畸变流程\n- 去畸变即反变换：已知畸变图像 (u_d, v_d)，求理想坐标 (u, v)\n- 工程上采用前向查表：对每个理想输出像素，用畸变模型计算其在输入畸变图中的对应坐标，再做双线性插值采样，固化映射表（maphex）由硬件直接查表执行\n- 逐点插值公式（双线性，q = 4 邻域像素，w = 与邻域距离权重）：\n```\nI(u, v) = Σ w_i · I(q_i)，  Σ w_i = 1\n```\n\n### 4. 卷帘快门 derolling 原理\n- 卷帘快门逐行曝光：第 y 行的曝光时刻 t_row(y) = t0 + (y / H) · t_readout（H 为图像高度，t_readout 为读出周期）\n- 相机运动时各行对应不同位姿，同一帧内出现整体扭曲（卷帘效应），SLAM 位姿估计误差随之增大\n- 补偿方法：用 IMU 数据积分出每行曝光时刻的旋转 R(t_row)，将各行统一投影到参考时刻 t_ref 的位姿：\n```\nx_ref = K · R_ref · R(t_row)ᵀ · K⁻¹ · x_row\n```\n- 其中 x_row、x_ref 为齐次坐标；R(t_row) 由陀螺仪角速度积分得到：\n```\nR(t_row) = R(t0) · exp(∫ ω(t) dt)， t ∈ [t0, t_row]\n```\n- 与去畸变合并后，maphex 一次性生成「畸变 + 行位姿」的复合映射表，硬件单次查表即可同时完成两项校正\n\n## IP 定位\n成像链路 IP，基于相机内外参和 IMU 数据，完成去畸变和 derolling。\n\n## 优化手段\n- 压缩流水线\n- 计算重排布\n\n## 量化成果\n- PR 面积降低 3.9%\n- PA 仿真功耗降低 16.1%\n","type":"ip"},{"file":"mdtsp.md","title":"mdtsp IP 全新开发","status":"先进工艺已TO","intro":"多帧处理 IP，负责 dtof 上下目/前后帧融合（pre-process、maphex、warp、merge）。","oneLiner":"多帧处理 IP，包括 pre-process、maphex、warp、merge。","results":"提升 sensor 33% 有效量程","md":"# mdtsp IP 全新开发\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（SLAM IP 设计）\n- 状态：先进工艺已TO\n- 简介：多帧处理 IP，负责 dtof 上下目/前后帧融合（pre-process、maphex、warp、merge）。\n\n## IP 定位\n多帧处理 IP，包括 pre-process、maphex、warp、merge。\n\n## 功能要点\n- 通过上下目、前后帧的 dtof 数据融合处理\n- 提升 sensor 有效量程\n\n## 量化成果\n- 提升 sensor 33% 有效量程\n","type":"ip"},{"file":"voapp.md","title":"项目6：voapp 链路 PPA 优化","status":"先进工艺已TO","intro":"双目定位链路 IP，计算 harris/census 特征角点并下采样生成 pyramid 图，供 KLT 逐层匹配。","oneLiner":"双目定位链路中，voapp IP 计算特征角点和下采样得到 pyramid 图，用于 klt 进行逐层特征匹配。","results":"IP 相比上一代 PR 面积优化 32.3%","md":"# 项目6：voapp 链路 PPA 优化\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（SLAM IP 设计）\n- 状态：先进工艺已TO\n- 简介：双目定位链路 IP，计算 harris/census 特征角点并下采样生成 pyramid 图，供 KLT 逐层匹配。\n\n## 方案背景：SLAM 双目定位\n- 双目视觉定位通过左右两目相机同步采集图像，利用视差恢复三维信息，并结合前后帧关联估计相机位姿，是 SLAM（即时定位与建图）前端的主流方案\n- 链路核心流程：图像 → 特征提取（角点）→ 图像金字塔 → 特征匹配/跟踪 → 位姿估计\n- 关键 IP 分工：\n  - voapp IP：计算特征角点（harris/census 算子）、下采样生成 pyramid 图\n  - klt IP：KLT（Kanade-Lucas-Tomasi）光流跟踪，在 pyramid 图上逐层匹配特征点\n- pyramid 图的作用：多尺度图像金字塔，KLT 由粗到精逐层跟踪，可处理大位移和快速运动，提升匹配鲁棒性\n- 本工作聚焦 voapp 链路的 PPA 优化，为 klt 提供更省面积、更低功耗的特征与金字塔数据\n\n## IP 定位\n双目定位链路中，voapp IP 计算特征角点和下采样得到 pyramid 图，用于 klt 进行逐层特征匹配。\n\n## 优化手段\n- harris/census 算子 linebuf 合并\n- pyramid 分时复用 memory\n- 追击实现 raster2tile\n\n## 量化成果\n- IP 相比上一代 PR 面积优化 32.3%\n","type":"ip"},{"file":"voa_harden.md","title":"voa_harden 交付","status":"先进工艺已TO","intro":"SLAM 链路 voa IP 的物理实现硬化（PR、时序收敛与签核）。","oneLiner":"（待补充）","results":"","md":"# voa_harden 交付\n\n- 时间：（待补充）\n- 单位：大疆 威新研发部（SLAM）\n- 状态：先进工艺已TO\n- 简介：SLAM 链路 voa IP 的物理实现硬化（PR、时序收敛与签核）。\n\n## IP 定位\n（待补充）\n\n## 功能要点\n（待补充）\n\n## 量化成果\n（待补充）\n","type":"harden"},{"file":"支持飞行VLX方案落地.md","title":"支持飞行VLX方案落地","status":"已结项","intro":"飞行快慢系统大模型算法调研与 rk182x 带宽实测，支持 VLX 方案落地。","oneLiner":"（待补充）","results":"","md":"# 支持飞行VLX方案落地\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（SLAM IP 设计）\n- 状态：已结项\n- 简介：飞行快慢系统大模型算法调研与 rk182x 带宽实测，支持 VLX 方案落地。\n\n## 工作内容\n- 飞行快慢系统大模型算法调研\n- 实测 rk182x 带宽\n\n## 量化成果\n（待补充）\n","type":"planning"},{"file":"no_rst寄存器调研.md","title":"项目8：no_rst 寄存器理论调研","status":"已落地","intro":"无复位寄存器调研并在 SLAM IP 批量落地，收益面积约 1%、功耗约 3%。","oneLiner":"（待补充）","results":"","md":"# 项目8：no_rst 寄存器理论调研\n\n- 时间：2023.07 - 至今\n- 单位：大疆 威新研发部（技术规划）\n- 状态：已落地\n- 简介：无复位寄存器调研并在 SLAM IP 批量落地，收益面积约 1%、功耗约 3%。\n\n## 方案背景：无复位寄存器原理\n### 1. 为什么能省面积/功耗\n- 标准库中带复位端 DFF 比无复位 DFF 面积更大（每 bit 多复位逻辑）；去掉复位端可换用更小的 cell\n- 复位树本身消耗布线资源与动态功耗：移除复位网络 → 布线拥塞（congestion）缓解、时钟/复位翻转功耗下降\n- 收益量级与实测一致：PR 面积约 -1%、PA 仿真功耗约 -3%\n\n### 2. 适用边界\n- 只对 datapath 寄存器可行：其值在使用前必被流水线刷新覆盖，上电后的未知值（x 态）不会扩散到结果\n- 控制寄存器、状态机、跨时钟域同步器、总线接口寄存器必须保留复位，否则行为不可预测\n\n### 3. 可测性与验证\n- DFT：无复位寄存器在 scan 模式下仍可移位装载，但上电初值不定，需靠 scan reset 或测试向量先写后测\n- 验证手段：x-prop 仿真（未初始化寄存器读传播检查）、formal 检查证明无寄存器被\"先读后写\"、软件初始化流程兜底\n- 风险点：异常复位场景（软复位/局部复位）下无复位寄存器不恢复，需确认业务允许\n\n## 工作内容\n- 基于 claude-opus4.6 完成 SLAM IP 批量替换无复位寄存器\n- 折算 PR 面积有约 1% 收益\n- PA 仿真功耗有约 3% 收益\n\n## 量化成果\n（待补充）\n","type":"planning"}],"在校":[{"file":"FPGA高速图像采集传输系统.md","title":"项目7：基于 FPGA 的高速图像采集传输系统","status":"Xilinx Artix-7 系列 FPGA 上板测试通过并验收","intro":"基于 FPGA 的 CMOS 图像采集 + SDRAM 缓存 + 千兆以太网传输系统，Artix-7 上板验收。","oneLiner":"应用于无人生产车间工件缺陷检测：通过 CMOS 图像传感器采集工件图像，超分辨率放大后利用千兆以太网送至上位机检测，缺陷被识别时进行反馈。","results":"","md":"# 项目7：基于 FPGA 的高速图像采集传输系统\n\n- 时间：2021.09 - 2022.06（简历另载 2021.06 起）\n- 单位：电子科技大学 × 长安汽车全球研发中心\n- 状态：Xilinx Artix-7 系列 FPGA 上板测试通过并验收\n- 简介：基于 FPGA 的 CMOS 图像采集 + SDRAM 缓存 + 千兆以太网传输系统，Artix-7 上板验收。\n\n## 项目背景\n应用于无人生产车间工件缺陷检测：通过 CMOS 图像传感器采集工件图像，超分辨率放大后利用千兆以太网送至上位机检测，缺陷被识别时进行反馈。\n\n## CMOS 图像采集部分\n- SCCB 总线进行 CMOS 图像传感器模式配置\n- 采集图像数据超分辨率放大后存入 SDRAM\n- 数据缓存与拼接模块实现数据位宽匹配，支持 8/16/24 位宽数据互相转换\n- SDRAM 读写控制器仲裁初始化、自动刷新、读、写等操作切换；双 bank 乒乓读写解决错帧问题\n- 异步 FIFO 处理 CMOS 传感器、SDRAM、以太网数据时钟异步（跨时钟域）\n- 统一局部复位完成异步复位同步释放，提升器件利用率和时序性能\n\n## 千兆以太网收发（IPV4 + UDP）\n- 数据接收：校验 MAC 地址、IP 地址、UDP 端口号，无误时解析数据存入 SDRAM；缺陷被识别时接收上位机发送的特征码\n- 数据发送：持续生成图像数据请求，对有效数据依次封装源/目标 MAC 地址、IP 地址、UDP 端口号、数据、CRC 校验值后发送；预先进行 IP 首部校验请求实现时序对齐\n- CRC 校验机制滤除错误数据，工具自动生成\n\n## 量化成果\n（待补充）\n","type":"ip"}],"实习":[{"file":"DTP包交换IP.md","title":"项目6：DTP 包交换 IP（先进工艺 / 先进工艺）","status":"已交付","intro":"八通道包过滤、优先级存储、轮询仲裁的 DTP 分组交换芯片设计与 UVM 验证（先进工艺）。","oneLiner":"基于 先进工艺 工艺，完成 DTP 分组交换芯片设计与验证：完成八通道连续输入数据的过滤，依据优先级排序存储，通道间基于轮询调度完成八通道转发输出。","results":"","md":"# 项目6：DTP 包交换 IP（先进工艺 / 先进工艺）\n\n- 时间：2022.06 - 2022.09\n- 单位：华为海思半导体与器件业务部 图灵 ICT 处理器部（数字芯片工程师，实习）\n- 状态：已交付\n- 简介：八通道包过滤、优先级存储、轮询仲裁的 DTP 分组交换芯片设计与 UVM 验证（先进工艺）。\n\n## 项目背景\n基于 先进工艺 工艺，完成 DTP 分组交换芯片设计与验证：完成八通道连续输入数据的过滤，依据优先级排序存储，通道间基于轮询调度完成八通道转发输出。\n\n## 设计要点\n- 面积：加入水线机制的高低优先级 FIFO+RAM 架构，存储面积较通用架构降低 15.6%，较其他面积优先架构降低 8.3%\n- 吞吐：八通道独立仲裁器提高输出通道吞吐率，平均包延迟降低至 2 个 cycle\n- 包过滤存储：统一错误过滤机制保证可拓展性；适当增大 RAM 深度防止覆写；拼接 EOP 与数据存入 RAM（而非存储包长）大幅降低面积\n- 包读出：FIFO 预读机制提前生成仲裁请求保证输出无气泡；读写指针水线迫近时送出低优先级包防止覆写；各通道控制逻辑独立、输出并行以降低时延\n- 仲裁：轮询仲裁保证公平；八通道仲裁模块独立并行处理\n- 输出选择：插入 clock gating，vld 无效时暂停数据选择，降低功耗\n- 配置寄存器：APB 异步桥实现 CPU APB 接口跨时钟域同步；支持包数统计上报；接收错包和 FIFO 上溢时上报中断\n\n## 验证要点\n- 基于 superbench 框架搭建 UVM 验证环境，覆盖包过滤、收发、统计功能，回归覆盖率收敛\n- 设计验证方案，分解测试点覆盖各功能点\n- 编写 xaction、driver、monitor、rm 等，加入流量控制、再封装等功能\n- 十余条 tc 回归 200 次通过，代码覆盖率 95.92%，功能覆盖率 100%\n\n## 其他产出\n- 实习期间输出多份项目内部工具文档\n\n## 量化成果\n（待补充）\n","type":"ip"}]},"generatedAt":"2026-11-13T02:05:17.286Z"};

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function mdToHtml(md) {
  const lines = md.split("\n");
  let html = "", inUl = false, inPre = false, inTable = false;
  const flushUl = () => { if (inUl) { html += "</ul>"; inUl = false; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.startsWith("```")) { flushUl(); html += inPre ? "</pre>" : "<pre>"; inPre = !inPre; continue; }
    if (inPre) { html += esc(line) + "\n"; continue; }
    if (/^\|\s*[-: ]+\|/.test(line)) continue;
    if (/^\|.*\|$/.test(line)) {
      flushUl();
      const cells = line.slice(1, -1).split("|").map((c) => esc(c.trim()));
      if (!inTable) {
        html += "<table style='font-size:12.5px;margin:6px 0'>";
        inTable = true;
        html += "<tr>" + cells.map((c) => `<th style="border-bottom:1px solid #e3e8ef;padding:4px 8px;text-align:left">${c}</th>`).join("") + "</tr>";
      } else {
        html += "<tr>" + cells.map((c) => `<td style="border-bottom:1px solid #f0f3f7;padding:4px 8px">${c}</td>`).join("") + "</tr>";
      }
      continue;
    } else if (inTable) { html += "</table>"; inTable = false; }
    if (/^#{1,3}\s/.test(line)) {
      flushUl();
      const lvl = Math.min(line.match(/^#+/)[0].length + 1, 3);
      html += `<h${lvl}>${esc(line.replace(/^#+\s*/, ""))}</h${lvl}>`;
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      if (!inUl) { html += "<ul>"; inUl = true; }
      html += `<li>${esc(line.replace(/^[-*]\s+/, ""))}</li>`;
      continue;
    }
    flushUl();
    if (line.trim() === "") continue;
    html += `<p>${esc(line)}</p>`;
  }
  flushUl();
  if (inPre) html += "</pre>";
  if (inTable) html += "</table>";
  return html;
}

function sortCats(keys) {
  return [...keys].sort((a, b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
}

function switchSub(name) {
  document.querySelectorAll(".pw-tab").forEach(b => b.classList.toggle("active", b.dataset.p === name));

}

function initProjects() {
  const cats = sortCats(Object.keys(DATA.projects));
  const sel = document.getElementById("projCat");
  sel.innerHTML = '<option value="">全部分类</option>' + cats.map(c => `<option value="${esc(c)}">${CAT_NAMES[c] || esc(c)}（${DATA.projects[c].length}）</option>`).join("");
  drawProjects("", "");
}

function drawProjects(kw, cat) {
  const host = document.getElementById("projList");
  const cats = sortCats(Object.keys(DATA.projects)).filter(c => !cat || c === cat);
  host.innerHTML = cats.map(c => {
    const items = DATA.projects[c].filter(it => !kw || (it.title + it.status + it.oneLiner).toLowerCase().includes(kw));
    if (!items.length) return "";
    const design = items.filter(it => it.type !== "planning");
    const planning = items.filter(it => it.type === "planning");
    const cardHtml = (it) => `
        <div class="proj-card ${it.type === "planning" ? "planning" : it.type === "harden" ? "harden" : ""}" data-cat="${esc(c)}" data-file="${esc(it.file)}">
          <div class="t">${esc(it.title.replace(/^项目\d+：/, ""))}${it.type === "planning" ? '<span class="p-tag">技术规划</span>' : ""}</div>
          <div class="s"><span class="proj-status">${esc(it.status || "")}</span>${it.intro ? " ｜ " + esc(it.intro) : (it.oneLiner ? " ｜ " + esc(it.oneLiner.slice(0, 46)) : "")}</div>
          ${it.results ? `<div class="r"><b>成果：</b>${esc(it.results)}</div>` : ""}
        </div>`;
    return `<div class="cat-block">
      <div class="cat-head"><span class="cat-name">${CAT_NAMES[c] || esc(c)}</span><span class="cat-count">${items.length}</span></div>
      ${design.length ? `<div class="proj-grid">${design.map(cardHtml).join("")}</div>` : ""}
      ${planning.length ? `<div class="proj-grid planning-row">${planning.map(cardHtml).join("")}</div>` : ""}
    </div>`;
  }).join("") || '<div class="empty">无匹配项目</div>';

  host.querySelectorAll(".proj-card").forEach(el => {
    el.addEventListener("click", () => openProject(el.dataset.cat, el.dataset.file));
  });
}

function openProject(cat, file) {
  const it = (DATA.projects[cat] || []).find(x => x.file === file);
  document.getElementById("modalText").innerHTML = it && it.md ? mdToHtml(it.md) : "未找到内容";
  document.getElementById("modal").classList.add("show");
}

document.getElementById("projFilter").addEventListener("input", e =>
  drawProjects(e.target.value.trim().toLowerCase(), document.getElementById("projCat").value));
document.getElementById("projCat").addEventListener("change", e =>
  drawProjects(document.getElementById("projFilter").value.trim().toLowerCase(), e.target.value));
</script>
