<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胡皓 · 个人工作台</title>
<style>
:root {
  --bg: #f4f6fa; --card: #fff; --ink: #1d2733; --sub: #65707e; --line: #e3e8ef;
  --accent: #1a4b8f; --accent-2: #2f6fd0; --ok: #1f9d55; --warn: #d97706; --bad: #c0392b; --chip: #eef3fb;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.65; }
header.top { background: linear-gradient(120deg, #163a6e, #1a4b8f 55%, #2f6fd0); color: #fff; padding: 18px 32px 0; }
.head-row { display: flex; align-items: baseline; justify-content: space-between; }
.head-row h1 { font-size: 20px; letter-spacing: 1px; }
.head-row .meta { font-size: 12px; opacity: .85; }
nav.tabs { display: flex; gap: 6px; margin-top: 14px; }
nav.tabs a.tab {
  padding: 9px 22px; font-size: 13.5px; text-decoration: none;
  background: rgba(255,255,255,.12); color: rgba(255,255,255,.85);
  border-radius: 10px 10px 0 0; transition: all .15s;
}
nav.tabs a.tab:hover { background: rgba(255,255,255,.2); }
nav.tabs a.tab.active { background: var(--bg); color: var(--accent); font-weight: 700; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 22px 32px 60px; }
.card { background: var(--card); border-radius: 12px; padding: 18px 22px; box-shadow: 0 2px 10px rgba(30,45,70,.06); margin-bottom: 18px; }
.card h2 { font-size: 15px; color: var(--accent); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1.5px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.card h2 .hint { font-size: 11px; color: var(--sub); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.kv { display: flex; gap: 8px; font-size: 13px; color: var(--sub); margin-bottom: 5px; }
.kv b { color: var(--ink); font-weight: 600; min-width: 56px; }
.tag { display: inline-block; background: var(--chip); color: var(--accent); border-radius: 4px; padding: 1px 8px; font-size: 11.5px; margin: 0 4px 4px 0; }
.edu { border-left: 3px solid var(--accent-2); padding-left: 12px; margin-bottom: 10px; }
.edu .t { font-weight: 600; font-size: 14px; }
.edu .d { font-size: 12.5px; color: var(--sub); }
.job-item { border-bottom: 1px solid #f0f3f7; padding: 10px 0; }
.job-item:last-child { border-bottom: none; }
.job-item .t { font-weight: 700; font-size: 14px; }
.job-item .d { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
.job-item ul { margin: 6px 0 0 18px; font-size: 12.5px; color: #3a4553; }
.job-item li { margin-bottom: 3px; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.stat { background: var(--card); border-radius: 12px; padding: 14px 18px; box-shadow: 0 2px 10px rgba(30,45,70,.06); }
.stat .num { font-size: 24px; font-weight: 700; color: var(--accent); }
.stat .lbl { font-size: 12px; color: var(--sub); }
.cat-block { margin-bottom: 20px; }
.cat-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cat-name { font-weight: 700; font-size: 14px; letter-spacing: .5px; }
.cat-count { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 9px; line-height: 18px; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.proj-card { background: #fbfcfe; border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; cursor: pointer; transition: all .15s; }
.proj-card:hover { border-color: var(--accent-2); box-shadow: 0 3px 10px rgba(47,111,208,.1); }
.proj-card .t { font-weight: 700; font-size: 13.5px; }
.proj-card .s { font-size: 11.5px; color: var(--sub); margin-top: 3px; }
.filter-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-row input, .filter-row select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; outline: none; font-family: inherit; background: #fff; }
.filter-row input:focus, .filter-row select:focus { border-color: var(--accent-2); }
.filter-row input { flex: 1; min-width: 220px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--sub); font-weight: 600; border-bottom: 1px solid var(--line); padding: 7px 8px; white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid #f0f3f7; vertical-align: top; }
tr:hover td { background: #f8fafd; }
.btn { border: none; cursor: pointer; background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-family: inherit; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--accent-2); }
.company-badge { display: inline-block; background: var(--chip); color: var(--accent); border-radius: 4px; padding: 0 7px; font-size: 11.5px; white-space: nowrap; }
.board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.col { background: #eef1f6; border-radius: 10px; padding: 10px; min-height: 220px; }
.col-head { font-size: 12.5px; font-weight: 700; color: var(--sub); margin-bottom: 8px; display: flex; justify-content: space-between; }
.col[data-status="todo"] .col-head { color: #4a5568; }
.col[data-status="applied"] .col-head { color: var(--accent-2); }
.col[data-status="interview"] .col-head { color: var(--warn); }
.col[data-status="offer"] .col-head { color: var(--ok); }
.col[data-status="rejected"] .col-head { color: var(--bad); }
.app { background: #fff; border-radius: 8px; padding: 10px 10px 8px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(30,45,70,.08); font-size: 12.5px; cursor: grab; position: relative; }
.app .c { font-weight: 700; font-size: 13px; }
.app .r { color: var(--sub); margin: 2px 0; }
.app .n { color: #8a94a3; font-size: 11.5px; }
.app .del { position: absolute; top: 6px; right: 8px; color: #c3cbd6; cursor: pointer; font-size: 13px; }
.app .del:hover { color: var(--bad); }
.app.dragging { opacity: .4; }
.col.over { outline: 2px dashed var(--accent-2); }
.add-form { display: flex; gap: 8px; flex-wrap: wrap; }
.add-form input { flex: 1; min-width: 130px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }
.add-form input:focus { border-color: var(--accent-2); }
.modal { position: fixed; inset: 0; background: rgba(20,30,45,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
.modal.show { display: flex; }
.modal .box { background: #fff; border-radius: 12px; width: min(820px, 92vw); max-height: 82vh; overflow: auto; padding: 26px 30px; font-size: 13.5px; line-height: 1.85; }
.modal .close { float: right; cursor: pointer; color: var(--sub); font-size: 18px; }
.modal h1 { font-size: 18px; color: var(--accent); margin: 6px 0 10px; }
.modal h2 { font-size: 15px; color: var(--accent); margin: 14px 0 6px; }
.modal ul { margin: 4px 0 4px 20px; }
.modal li { margin-bottom: 2px; }
.modal pre { background: #f6f8fb; border-radius: 6px; padding: 8px 12px; font-size: 12px; overflow: auto; margin: 6px 0; }
.modal p { margin: 4px 0; }
.empty { color: var(--sub); font-size: 12px; text-align: center; padding: 16px 0; }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #1d2733; color: #fff; padding: 9px 22px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99; }
.toast.show { opacity: .95; }
.portal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.portal-card { background: var(--card); border-radius: 14px; padding: 26px 28px; box-shadow: 0 2px 10px rgba(30,45,70,.06); text-decoration: none; color: var(--ink); display: block; transition: all .18s; border: 1px solid transparent; }
.portal-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(26,75,143,.13); border-color: var(--accent-2); }
.portal-card .pt { font-size: 18px; font-weight: 700; color: var(--accent); }
.portal-card .pd { font-size: 13px; color: var(--sub); margin-top: 6px; }
.portal-card .pn { margin-top: 14px; font-size: 13px; color: var(--accent-2); font-weight: 600; }

.proj-status { color: var(--accent); font-weight: 700; }

.row-label { font-size: 12px; color: #9a6b1f; font-weight: 700; margin: 4px 0 8px; letter-spacing: .5px; }
.proj-grid.planning-row { margin-top: 10px; }
.proj-card .p-tag { display: inline-block; background: #f6e7c8; color: #8a5a13; border-radius: 4px; padding: 0 6px; font-size: 10.5px; font-weight: 400; margin-left: 8px; vertical-align: 1px; }


.proj-card .r { margin-top: 5px; font-size: 11.5px; color: #3d4a5c; background: rgba(47,111,208,.07); border-radius: 5px; padding: 3px 8px; }
.proj-card .r b { color: var(--accent); font-weight: 600; }

.pw-hero { background: linear-gradient(120deg, #163a6e, #1a4b8f 55%, #2f6fd0); color: #fff; padding: 34px 32px 26px; }
.pw-hero .inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.pw-hero h1 { font-size: 28px; letter-spacing: 2px; }
.pw-hero .headline { font-size: 14px; opacity: .9; margin-top: 6px; }
.pw-hero .contact { font-size: 12.5px; opacity: .85; margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; }
.pw-nav { background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 2px 8px rgba(30,45,70,.05); }
.pw-nav .inner { max-width: 1100px; margin: 0 auto; padding: 0 32px; display: flex; gap: 4px; }
.pw-tab { padding: 13px 22px; font-size: 13.5px; color: var(--sub); cursor: pointer; border-bottom: 2.5px solid transparent; text-decoration: none; }
.pw-tab:hover { color: var(--accent-2); }
.pw-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.pw-wrap { max-width: 1100px; margin: 0 auto; padding: 22px 32px 70px; }
.panel { display: none; }
.panel.active { display: block; }

.work-summary { display: inline-block; margin-top: 6px; background: rgba(47,111,208,.08); color: var(--accent); border-radius: 5px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }

.work-group-title { font-size: 13px; font-weight: 700; color: var(--accent); border-bottom: 1px solid #cdd9ec; padding-bottom: 2px; margin: 8px 0 4px; letter-spacing: 1px; }

/* 手机适配 */
@media (max-width: 760px) {
  header.top { padding: 16px 16px 0; }
  .head-row { flex-direction: column; gap: 4px; }
  .head-row h1 { font-size: 18px; }
  .head-row .meta { font-size: 11px; }
  nav.tabs a.tab { padding: 8px 12px; font-size: 12.5px; }
  .wrap { padding: 14px 14px 50px; }
  .stat-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { padding: 12px 14px; }
  .stat .num { font-size: 20px; }
  .card { padding: 14px 16px; }
  .filter-row input, .filter-row select { min-width: 0; width: 100%; }
  .readonly-table { display: none; }
}
.panel { display: none; }
.panel.active { display: block; }
.notice { background: #fff8ec; border: 1px solid #f0dcc0; color: #8a5a13; border-radius: 10px; padding: 10px 16px; font-size: 12.5px; margin-bottom: 16px; }
.app-row { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(30,45,70,.06); padding: 14px 18px; margin-bottom: 12px; }
.app-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.app-head .co { font-size: 14.5px; font-weight: 700; }
.app-head .ro { font-size: 13px; color: var(--sub); }
.stepper { display: flex; gap: 2px; margin-top: 10px; flex-wrap: wrap; }
.step { padding: 3px 8px; border-radius: 6px; font-size: 11.5px; background: #f1f4f9; color: #9aa4b2; white-space: nowrap; }
.step.done { background: var(--chip); color: var(--accent); }
.step.current { background: var(--accent); color: #fff; font-weight: 700; }
.step.eliminated { background: #fbe9e7; color: var(--bad); font-weight: 700; }
.tag-eliminated { background: #fbe9e7; color: var(--bad); border-radius: 4px; padding: 1px 8px; font-size: 12px; }
.salary-line { margin-top: 8px; font-size: 12.5px; color: #3d4a5c; background: rgba(47,111,208,.07); border-radius: 5px; padding: 4px 10px; }
.mobile-list { display: none; }
@media (max-width: 760px) {
  .mobile-list { display: block; }
  .job-card-m { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  .job-card-m .t { font-weight: 700; font-size: 13px; }
  .job-card-m .d { font-size: 12px; color: var(--sub); margin-top: 2px; }
}
</style>
</head>

      <select id="jobCompany"><option value="">全部公司</option></select>
    </div>
    <div class="card readonly-table" style="padding:0">

  <section class="panel" id="panel-apps">

      <div class="stat"><div class="num" id="aActive">-</div><div class="lbl">进行中</div></div>
      <div class="stat"><div class="num" id="aEliminated">-</div><div class="lbl">已淘汰</div></div>
      <div class="stat"><div class="num" id="aOffer">-</div><div class="lbl">已谈薪</div></div>
    </div>
    <div id="appList"></div>
  </section>
</div>

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.querySelectorAll("nav.tabs a.tab").forEach(el => {
  el.addEventListener("click", (e) => {
    e.preventDefault();
    switchTab(el.dataset.tab);
  });
});
function switchTab(name) {
  document.querySelectorAll("nav.tabs a.tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  history.replaceState(null, "", "#" + name);
}

(function () {
  const p = DATA.profile, o = DATA.objective || {};
  document.getElementById("wName").textContent = p.full_name || "";
  document.getElementById("wHeadline").textContent = p.headline || "";
  document.getElementById("wPhone").textContent = p.phone || "";
  document.getElementById("wEmail").textContent = p.email || "";
  document.getElementById("wLoc").textContent = p.location || "";
  document.getElementById("wRoles").innerHTML = (o.target_roles || []).map(r => `<span class="tag">${esc(r)}</span>`).join("");
  document.getElementById("wProjects").textContent = DATA.projectCount;
  document.getElementById("wJobs").textContent = DATA.jobs.length;
  document.getElementById("wApps").textContent = DATA.apps.length;
  document.getElementById("wActive").textContent = DATA.apps.filter(a => a.eliminatedAt === null).length;
  document.getElementById("genAt").textContent = new Date(DATA.generatedAt).toLocaleString("zh-CN");
  renderJobs();
  renderApps();
  const h = location.hash.replace("#", "");
  if (["personal", "jobs", "apps"].includes(h)) switchTab(h);
})();

function renderJobs() {
  const kw = document.getElementById("jobFilter").value.trim().toLowerCase();
  const co = document.getElementById("jobCompany").value;
  const sel = document.getElementById("jobCompany");
  const companies = [...new Set(DATA.jobs.map(j => j.company))];
  sel.innerHTML = '<option value="">全部公司</option>' + companies.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  sel.value = co;
  const rows = DATA.jobs.filter(j =>
    (!co || j.company === co) &&
    (!kw || [j.company, j.title, j.city, j.req].join(" ").toLowerCase().includes(kw))
  );
  document.getElementById("jobBody").innerHTML = rows.map(j =>
    `<tr>
      <td><span class="company-badge">${esc(j.company)}</span></td>
      <td>${esc(j.title)}</td>
      <td>${esc(j.city || "")}</td>
      <td style="color:var(--sub)">${esc(j.req || "")}</td>
      <td>${j.apply ? `<a href="${esc(j.apply)}" target="_blank" rel="noopener">官网投递</a>` : ""}</td>
    </tr>`).join("") || '<tr><td colspan="5"><div class="empty">无匹配岗位</div></td></tr>';
  document.getElementById("jobMobile").innerHTML = rows.map(j =>
    `<div class="job-card-m"><div class="t">${esc(j.company)} · ${esc(j.title)}</div>
     <div class="d">${esc(j.city || "")} ｜ ${esc(j.req || "")}</div>
     ${j.apply ? `<div style="margin-top:6px"><a href="${esc(j.apply)}" target="_blank" rel="noopener">官网投递</a></div>` : ""}</div>`
  ).join("") || '<div class="empty">无匹配岗位</div>';
}
document.getElementById("jobFilter").addEventListener("input", renderJobs);
document.getElementById("jobCompany").addEventListener("change", renderJobs);

function stepClass(a, i) {
  if (a.eliminatedAt !== null) {
    if (i < a.eliminatedAt) return "done";
    if (i === a.eliminatedAt) return "eliminated";
    return "future";
  }
  if (i < a.stage) return "done";
  if (i === a.stage) return "current";
  return "future";
}

function renderApps() {
  const APPS = DATA.apps;
  document.getElementById("aTotal").textContent = APPS.length;
  document.getElementById("aActive").textContent = APPS.filter(a => a.eliminatedAt === null).length;
  document.getElementById("aEliminated").textContent = APPS.filter(a => a.eliminatedAt !== null).length;
  document.getElementById("aOffer").textContent = APPS.filter(a => a.stage >= 9 && a.eliminatedAt === null).length;
  const host = document.getElementById("appList");
  if (!APPS.length) { host.innerHTML = '<div class="empty">暂无投递记录</div>'; return; }
  host.innerHTML = APPS.map(a => {
    const steps = STAGES.map((s, i) => `<span class="step ${stepClass(a, i)}">${esc(s)}</span>`).join('<span class="arrow" style="color:#c9d2dd;font-size:10px;align-self:center">›</span>');
    return `<div class="app-row">
      <div class="app-head">
        <span class="co">${esc(a.company)}</span>
        <span class="ro">${esc(a.role)}</span>
        <span style="font-size:12px;color:#9aa4b2">${esc(a.city || "")}${a.eliminatedAt !== null ? ` ｜ <span class="tag-eliminated">已淘汰于：${esc(STAGES[a.eliminatedAt] || "")}</span>` : ""}</span>
      </div>
      <div class="stepper">${steps}</div>
      ${a.salary ? `<div class="salary-line"><b>待遇：</b>${esc(a.salary)}</div>` : ""}
    </div>`;
  }).join("");
}
